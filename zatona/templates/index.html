<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ماركت زتونه - الرئيسية</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="header">
        <h2>📦 ماركت زتونه</h2>
        <a href="/">🏠 الرئيسية</a>
        <a href="/seller">👨‍💼 البائع</a>
        <a href="/buyer">🛒 المشتري</a>
    </div>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <h1>مرحباً بك في نظام ماركت زتونه</h1>
        <p style="text-align: center;">اختر نوع المستخدم:</p>
        <div class="nav-buttons">
            <a href="/seller" class="btn btn-seller">👨‍💼 الدخول كبائع</a>
            <a href="/buyer" class="btn btn-buyer">🛒 الدخول كمشتري</a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
